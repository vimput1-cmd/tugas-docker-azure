<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elysia CloudApp</title>
    <style>
        body{margin:0;font-family:'Segoe UI',sans-serif;color:#fff;min-height:100vh;display:flex;justify-content:space-between;align-items:flex-end;padding:25px 3.5vw;box-sizing:border-box;}
        .bg{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:-2;pointer-events:none;}
        .bg iframe{width:100vw;height:100vh;min-width:177.7vh;min-height:56.2vw;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);}
        .ov{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,0.25);z-index:-1;}
        .card{background:rgba(255,255,255,0.15);backdrop-filter:blur(20px);padding:18px;border-radius:18px;width:360px;box-shadow:0 8px 30px rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.3);}
        h3{margin:0 0 4px 0;font-size:18px;font-weight:600;} p{margin:0 0 10px 0;font-size:11px;opacity:0.85;}
        .row-in{display:flex;gap:6px;margin-bottom:8px;} input{flex:1;padding:8px 10px;border-radius:8px;border:none;outline:none;background:rgba(255,255,255,0.92);color:#111;font-size:13px;}
        button{padding:8px 14px;border-radius:8px;border:none;background:linear-gradient(135deg,#ff758c,#ff7eb3);color:#fff;font-weight:600;cursor:pointer;font-size:13px;}
        ul{list-style:none;padding:0;margin:0;max-height:130px;overflow-y:auto;}
        li{background:rgba(255,255,255,0.18);margin:4px 0;padding:6px 10px;border-radius:8px;display:flex;justify-content:space-between;font-size:12px;}
        .chat-box{max-height:120px;overflow-y:auto;display:flex;flex-direction:column-reverse;margin-bottom:8px;}
        .c-user{background:rgba(255,255,255,0.2);align-self:flex-end;margin:3px 0;padding:5px 8px;border-radius:8px;font-size:12px;}
        .c-elysia{background:rgba(255,117,140,0.45);align-self:flex-start;margin:3px 0;padding:5px 8px;border-radius:8px;font-size:12px;}
        @media(max-width:850px){body{flex-direction:column;align-items:center;gap:15px;justify-content:center;}}
    </style>
</head>
<body>
    <div class="bg"><iframe src="https://www.youtube.com/embed/wBsluFsDAEg?autoplay=1&mute=1&loop=1&playlist=wBsluFsDAEg&controls=0&playsinline=1" frameborder="0" allow="autoplay"></iframe></div>
    <div class="ov"></div>

    <!-- POJOK KIRI BAWAH: CHAT ISENG ELYSIA -->
    <div class="card">
        <h3>Elysia AI Chat</h3><p>Fitur Percakapan Cerdas (Gemini AI)</p>
        <div class="chat-box">{{ chats_html|safe }}</div>
        <form method="POST"><div class="row-in"><input name="chat_msg" placeholder="Ajak Elysia bicara..." required autocomplete="off"><button>Kirim</button></div></form>
    </div>

    <!-- POJOK KANAN BAWAH: TUGAS UTAMA KOMPUTASI AWAN -->
    <div class="card">
        <h3>Elysia CloudApp</h3><p>Azure VM (70.153.140.113) • PostgreSQL Healthy</p>
        <form method="POST"><div class="row-in"><input name="content" placeholder="Tulis data pengujian..." required><button>Simpan</button></div></form>
        <p style="margin:6px 0 4px 0;font-weight:600;font-size:12px;">Data Tersimpan di DB:</p>
        <ul>{{ notes_html|safe }}</ul>
    </div>

    <script>
        let r = {{ r_txt|tojson }};
        if(r && 'speechSynthesis' in window){
            let u = new SpeechSynthesisUtterance(r);
            u.pitch = 1.25; u.rate = 1.05;
            window.speechSynthesis.speak(u);
        }
    </script>
</body>
</html>
